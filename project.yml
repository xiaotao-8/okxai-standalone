name: OKXAI
options:
  bundleIdPrefix: com.okxai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  OKXAI:
    type: application
    platform: iOS
    sources:
      - path: AIClient.swift
      - path: AppStore.swift
      - path: KeychainStore.swift
      - path: Models.swift
      - path: OKXAIApp.swift
      - path: OKXAPI.swift
      - path: Views.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OKXAI
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

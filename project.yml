name: OKXAI
options:
  bundleIdPrefix: com.okxai
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  OKXAI:
    type: application
    platform: iOS
    sources:
      - path: AIClient.swift
      - path: AppStore.swift
      - path: KeychainStore.swift
      - path: Models.swift
      - path: ModelProviders.swift
      - path: OKXAIApp.swift
      - path: OKXAPI.swift
      - path: Theme.swift
      - path: Views.swift
      - path: Assets.xcassets
      - path: Sources/LiveActivityManager.swift
      - path: Sources/Shared/WidgetData.swift
    entitlements:
      path: Config/OKXAI.entitlements
    dependencies:
      - target: OKXWidgetExtension
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OKXAI
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
  OKXWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget/OKXAIWidget.swift
      - path: Sources/Shared/WidgetData.swift
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: 欧易持仓
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/OKXWidgetExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okxai.OKXAI.OKXWidgetExtension

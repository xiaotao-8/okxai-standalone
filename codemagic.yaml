workflows:
  # 模拟器构建 + 启动截图验证。工程用 XcodeGen 生成（project.yml），
  # 首次构建须先跑 xcodegen。
  okxai-standalone-simulator:
    name: OKXAI Standalone · simulator build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "OKXAI.xcodeproj"
        XCODE_SCHEME: "OKXAI"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: 生成工程（XcodeGen）
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
          ls -la "$XCODE_PROJECT"
      - name: Build for the simulator
        script: |
          set -e
          mkdir -p build
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: 检查产物（列出 .app 内容与 bundle ID）
        script: |
          APP="$CM_BUILD_DIR/build/Build/Products/Debug-iphonesimulator/OKXAI.app"
          ls -la "$APP" || echo "NO .app"
          echo "--- Info.plist ---"
          plutil -p "$APP/Info.plist" 2>/dev/null | grep -i -E "bundle|executable|version" || echo "NO Info.plist"
          echo "--- binary ---"
          file "$APP/OKXAI" 2>/dev/null || echo "NO BINARY"
          echo "--- widget extension ---"
          ls -la "$APP/PlugIns" || echo "NO PlugIns"
          plutil -p "$APP/PlugIns/OKXWidgetExtension.appex/Info.plist" 2>/dev/null | grep -i -E "bundle|NSExtension" || echo "NO EXTENSION INFO"
          file "$APP/PlugIns/OKXWidgetExtension.appex/OKXWidgetExtension" 2>/dev/null || echo "NO EXTENSION BINARY"
          true
      - name: Package the .app
        script: |
          set -e
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry OKXAI-simulator.zip OKXAI.app
          cp OKXAI-simulator.zip "$CM_BUILD_DIR/OKXAI-simulator.zip"
      - name: 模拟器验证（安装+启动+截图）
        script: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev.get('isAvailable', True):
                      print(dev['udid']); raise SystemExit
          ")
          echo "simulator: $UDID"
          if [ -z "$UDID" ]; then echo "no available iPhone simulator on this machine"; exit 1; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$CM_BUILD_DIR/build/Build/Products/Debug-iphonesimulator/OKXAI.app"
          # 1) 登录页（不带参数）
          xcrun simctl launch "$UDID" com.okxai.OKXAI
          sleep 8
          xcrun simctl io "$UDID" screenshot "$CM_EXPORT_DIR/okxai-standalone-launch.png"
          xcrun simctl terminate "$UDID" com.okxai.OKXAI || true
          # 2) 智能体页
          xcrun simctl launch "$UDID" com.okxai.OKXAI -PreviewAgent -PreviewTab=4
          sleep 8
          xcrun simctl io "$UDID" screenshot "$CM_EXPORT_DIR/okxai-standalone-launch-2.png"
          xcrun simctl terminate "$UDID" com.okxai.OKXAI || true
          # 3) 首页
          xcrun simctl launch "$UDID" com.okxai.OKXAI -PreviewAgent
          sleep 8
          xcrun simctl io "$UDID" screenshot "$CM_EXPORT_DIR/okxai-standalone-launch-3.png"
          xcrun simctl terminate "$UDID" com.okxai.OKXAI || true
          # 4) 行情详情（K 线）
          xcrun simctl launch "$UDID" com.okxai.OKXAI -PreviewAgent -PreviewTab=1 -PreviewDetail=BTC-USDT
          sleep 10
          xcrun simctl io "$UDID" screenshot "$CM_EXPORT_DIR/okxai-standalone-launch-4.png"
          echo "verify done"
    artifacts:
      - OKXAI-simulator.zip
      - build/Build/Products/Debug-iphonesimulator/OKXAI.app
      - /tmp/xcodebuild_logs/*.log

  # 真机未签名 IPA —— 免费个人签名（SideKite）重签后安装，无需开发者账号
  okxai-standalone-unsigned:
    name: OKXAI Standalone (Unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: OKXAI.xcodeproj
        XCODE_SCHEME: OKXAI
    scripts:
      - name: 生成工程（XcodeGen）
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: 构建真机未签名版
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 打包未签名 IPA
        script: |
          set -e
          mkdir -p "$CM_EXPORT_DIR/Payload"
          cp -r "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/OKXAI.app" "$CM_EXPORT_DIR/Payload/"
          cd "$CM_EXPORT_DIR" && zip -rq OKXAI-unsigned.ipa Payload
          ls -la "$CM_EXPORT_DIR"
    artifacts:
      - $CM_EXPORT_DIR/OKXAI-unsigned.ipa
